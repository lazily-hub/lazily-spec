name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  schemas:
    name: JSON Schema drift-prevention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate schemas vs conformance fixtures
        run: make test-schemas

  coverage:
    name: Feature-matrix single-source guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # docs/coverage.md must match the canonical coverage.json. (Sibling binding
      # READMEs are not checked out here, so they are skipped; run
      # `make coverage-sync` locally with siblings present to update them.)
      - name: Check coverage table is generated from coverage.json
        run: make coverage-check

      # Every scenario must carry a stable `id`/`name`. Nine bindings resolve
      # scenario identity the same way, and one with neither key falls back to
      # its positional index — where inserting a scenario ahead of it silently
      # rebinds every ledger entry naming it (#lzspecscenarioids).
      - name: Check every corpus scenario carries a stable identifier
        run: make scenario-identity-check

      # The claim guard reads each binding's OWN conformance ledger, so the
      # siblings have to be present. Only `scripts/` is needed — a blobless
      # sparse clone keeps this to a few hundred KB per repo. `set -e` plus
      # `--require-all` below means a clone that silently fails is a red build
      # rather than a binding whose marks quietly go unchecked.
      - name: Fetch sibling binding ledgers
        run: |
          set -e
          for repo in rs py kt js dart zig go cpp cs gd; do
            git clone --depth 1 --filter=blob:none --sparse \
              "https://github.com/lazily-hub/lazily-$repo.git" "../lazily-$repo"
            git -C "../lazily-$repo" sparse-checkout set scripts
          done

      - name: Check every shipped mark is backed by a replayed fixture
        run: node scripts/check-coverage-claims.mjs --check --require-all

  lean:
    name: Lean formal model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean formal model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
